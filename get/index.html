<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Volum</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://app-volum.com/">
  <link rel="icon" href="/assets/icon.png">
  <style>
    :root { --bg: #0A121E; --accent: #A7FF41; --text: #FFFFFF; --muted: #B0B0B0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 24px 16px; background: var(--bg); color: var(--text); text-align: center;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.5px; }
    p { margin: 0; color: var(--muted); }
    .stores { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
    .stores img { display: block; height: 56px; width: auto; }
    a.home { color: var(--accent); font-size: 14px; }
  </style>
</head>
<body>
  <h1>Get Volum</h1>
  <p id="msg">Pick your store:</p>
  <div class="stores">
    <a id="play" href="https://play.google.com/store/apps/details?id=com.volum.app&amp;referrer=utm_source%3Dapp-volum.com%26utm_medium%3Dqr%26utm_campaign%3Dqr" rel="noopener">
      <img src="/assets/badges/play-en.png" alt="Get it on Google Play" width="646" height="250" style="height:74px">
    </a>
    <a id="appstore" href="https://apps.apple.com/app/id6759938940" rel="noopener">
      <img src="/assets/badges/appstore-en.svg" alt="Download on the App Store" width="120" height="40">
    </a>
  </div>
  <a class="home" href="/">app-volum.com</a>
  <script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var android = /Android/i.test(ua);
      var target = ios ? document.getElementById('appstore') : android ? document.getElementById('play') : null;
      if (window.plausible) { try { window.plausible('QR_Scan', { props: { os: ios ? 'ios' : android ? 'android' : 'other' } }); } catch (e) {} }
      if (target) {
        document.getElementById('msg').textContent = 'Opening the store…';
        setTimeout(function () { location.replace(target.href); }, 600);
      }
    })();
  </script>
  <script defer data-domain="app-volum.com" src="https://plausible.io/js/script.js"></script>
</body>
</html>
